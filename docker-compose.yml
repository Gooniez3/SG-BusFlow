name: sg-busflow

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: busflow
      POSTGRES_PASSWORD: busflow
      POSTGRES_DB: busflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busflow -d busflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Later: api, web, mobile

volumes:
  postgres_data:
